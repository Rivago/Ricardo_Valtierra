 
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificaciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light" onload="mostrar()">

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Registro de Calificaciones
        </h2>

        <div class="card p-3 mb-4">
            <h4>Agregar alumno</h4>

            <label>Nombre:</label>
            <input type="text" id="nombre" class="form-control mb-2">

            <label>Correo:</label>
            <input type="email" id="correo" class="form-control mb-2">

            <label>Calificación:</label>
            <input type="number" id="calificacion"
                   class="form-control mb-3" min="0" max="10">

            <button class="btn btn-primary" onclick="agregar()">
                Agregar alumno
            </button>
        </div>

        <h4>Lista de alumnos</h4>

        <table class="table table-bordered table-striped text-center">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Calificación</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tabla"></tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>
</html>
